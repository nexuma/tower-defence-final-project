# Runs the same checks as "Checks before every commit" in README.md.
name: Flutter checks

on:
  push:
    paths:
      - "tower_defence_code/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "tower_defence_code/**"
      - ".github/workflows/flutter.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tower_defence_code
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9   # same version as local development
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
